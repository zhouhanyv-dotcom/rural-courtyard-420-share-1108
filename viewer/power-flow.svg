<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1110"><rect width="1300" height="1110" fill="#fafbf7"/><style>text{font-family:Microsoft YaHei,sans-serif;fill:#233b35}.b{fill:#e1e9e2;stroke:#8ca69a;stroke-width:1.4}.l{fill:none;stroke:#557e87;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#557e87"/></marker></defs><text x="35" y="44" font-size="25">电怎样分：基本生活优先，再用余电充车 · R3.4</text><text x="35" y="78" font-size="15">光伏9.2kWp不扩大；主储能172.8kWh，备用隔离电池另列，汽车电池不计房屋供电。</text><rect x="35" y="120" width="360" height="110" rx="7" class="b"/><text x="49" y="148" font-size="17">住宅 / 机房 / 棚顶光伏</text><text x="49" y="178" font-size="14">各分区经匹配隔离、保护和MPPT</text><text x="49" y="206" font-size="14">不是46块面板随意串并</text><rect x="465" y="120" width="360" height="110" rx="7" class="b"/><text x="479" y="148" font-size="17">混合逆变与系统管理</text><text x="479" y="178" font-size="14">同时看瞬时功率、SOC和优先级</text><text x="479" y="206" font-size="14">正常可选市电，预算不计市电</text><rect x="895" y="120" width="370" height="110" rx="7" class="b"/><text x="909" y="148" font-size="17">3组×12模块运行电池柜</text><text x="909" y="178" font-size="14">每柜匹配保护/隔离/BMS</text><text x="909" y="206" font-size="14">成套并联设计，不能裸并电池</text><polyline points="395,175 465,175" class="l"/><polyline points="895,175 825,175" class="l"/><rect x="465" y="310" width="360" height="110" rx="7" class="b"/><text x="479" y="338" font-size="17">主隔离 / 计量 → B1–B8分路</text><text x="479" y="368" font-size="14">位于干电间，水路另走湿区</text><text x="479" y="396" font-size="14">保护/接地/漏电与桩须成套选型</text><polyline points="645,230 645,310" class="l"/><rect x="35" y="500" width="360" height="110" rx="7" class="b"/><text x="49" y="528" font-size="17">B1 主冷库 + 温度告警</text><text x="49" y="558" font-size="14">基本保冷，独立分路</text><text x="49" y="586" font-size="14">不能与B2误当双独立电源</text><rect x="465" y="500" width="360" height="110" rx="7" class="b"/><text x="479" y="528" font-size="17">B2 转存柜 / 照明 / 通信</text><text x="479" y="558" font-size="14">基本回路；主冷库故障可转存</text><text x="479" y="586" font-size="14">逆变器/BMS故障仍可能共同停电</text><rect x="895" y="500" width="370" height="110" rx="7" class="b"/><text x="909" y="528" font-size="17">B3 P1/P2 + UV / 水处理</text><text x="909" y="558" font-size="14">保基本供水，一用一备</text><text x="909" y="586" font-size="14">缺水停泵；水质异常停相关出水</text><rect x="35" y="675" width="360" height="110" rx="7" class="b"/><text x="49" y="703" font-size="17">B4 生活插座 / 电脑</text><text x="49" y="733" font-size="14">按预算使用，低SOC减载</text><text x="49" y="761" font-size="14">不把电量大当作输出功率无限</text><rect x="465" y="675" width="360" height="110" rx="7" class="b"/><text x="479" y="703" font-size="17">B5 烹调 / 热水 / 空调</text><text x="479" y="733" font-size="14">分别子回路、管理峰值</text><text x="479" y="761" font-size="14">不让多个大功率负载任意齐开</text><rect x="895" y="675" width="370" height="110" rx="7" class="b"/><text x="909" y="703" font-size="17">B6 灌溉控制 / 定时阀</text><text x="909" y="733" font-size="14">缺水或低SOC暂停</text><text x="909" y="761" font-size="14">阀门默认关，不拖停生活供水</text><rect x="35" y="850" width="360" height="110" rx="7" class="b"/><text x="49" y="878" font-size="17">B7 电车专用回路</text><text x="49" y="908" font-size="14">家用保底+实测余电足够才开</text><text x="49" y="936" font-size="14">日余2/4度是AC预算，非入车净量</text><rect x="465" y="850" width="360" height="110" rx="7" class="b"/><text x="479" y="878" font-size="17">B8 隔离预留</text><text x="479" y="908" font-size="14">没有连接负载</text><text x="479" y="936" font-size="14">不虚算供电或备用发电收益</text><polyline points="645,420 645,465 15,465" class="l"/><polyline points="645,465 875,465" class="l"/><polyline points="15,465 15,905" fill="none" stroke="#557e87" stroke-width="2"/><polyline points="15,555 35,555" class="l"/><polyline points="15,730 35,730" class="l"/><polyline points="15,905 35,905" class="l"/><polyline points="445,465 445,905" fill="none" stroke="#557e87" stroke-width="2"/><polyline points="445,555 465,555" class="l"/><polyline points="445,730 465,730" class="l"/><polyline points="445,905 465,905" class="l"/><polyline points="875,465 875,730" fill="none" stroke="#557e87" stroke-width="2"/><polyline points="875,555 895,555" class="l"/><polyline points="875,730 895,730" class="l"/><text x="35" y="1045" font-size="15">故障优先级：停EV → 停灌溉/空气制水及可选负载 → 按实测保B1/B2/B3。功能分组还需现场子回路。</text><text x="35" y="1080" font-size="14">模型路线不是线径/断路器/接地施工图；最终短路、压降、选择性、漏电保护和停网隔离均需核定。</text></svg>