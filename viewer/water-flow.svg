<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1400"><rect width="1300" height="1400" fill="#fafbf7"/><style>text{font-family:Microsoft YaHei,sans-serif;fill:#233b35}.b{fill:#e1e9e2;stroke:#8ca69a;stroke-width:1.4}.l{fill:none;stroke:#557e87;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#557e87"/></marker></defs><text x="35" y="44" font-size="25">水罐里的水，怎样用到生活和菜床 · R3.6</text><text x="35" y="78" font-size="15">独立存水：1800L原水＋300L杂用＋500L饮水；水质用途分开，管线为功能示意。</text><rect x="35" y="120" width="360" height="110" rx="7" class="b"/><text x="49" y="148" font-size="17">屋面 / 合格外部补水</text><text x="49" y="178" font-size="14">W23拦叶篮 → W10初雨弃流</text><text x="49" y="206" font-size="14">外补需要合适压力/提升与防污染</text><rect x="465" y="120" width="360" height="110" rx="7" class="b"/><text x="479" y="148" font-size="17">单只2000L原水罐</text><text x="479" y="178" font-size="14">常备1800L / 设计可取1600L</text><text x="479" y="206" font-size="14">东向V1低位取水，非直接饮用</text><rect x="895" y="120" width="370" height="110" rx="7" class="b"/><text x="909" y="148" font-size="17">P1/P2一用一备</text><text x="909" y="178" font-size="14">阀门、干转保护与小流量稳压</text><text x="909" y="206" font-size="14">未选实机前不保证压力和扬程</text><polyline points="395,175 465,175" class="l"/><polyline points="825,175 895,175" class="l"/><rect x="35" y="330" width="360" height="110" rx="7" class="b"/><text x="49" y="358" font-size="17">按检测选处理 + 末端消毒</text><text x="49" y="388" font-size="14">不是所有滤芯/UV都能处理所有污染</text><text x="49" y="416" font-size="14">水质合适才供生活和食用菜分支</text><rect x="465" y="330" width="360" height="110" rx="7" class="b"/><text x="479" y="358" font-size="17">生活龙头 + 独立RO分支</text><text x="479" y="388" font-size="14">生活原水预算70L/日</text><text x="479" y="416" font-size="14">RO进22 → 成品5.5 / 浓水16.5L</text><rect x="895" y="330" width="370" height="110" rx="7" class="b"/><text x="909" y="358" font-size="17">仅20L日用RO工作箱</text><text x="909" y="388" font-size="14">合格RO成品5.5L/日，小量周转</text><text x="909" y="416" font-size="14">480L封装饮水独立备用，不走这根管</text><polyline points="395,385 465,385" class="l"/><polyline points="825,385 895,385" class="l"/><rect x="35" y="540" width="360" height="110" rx="7" class="b"/><text x="49" y="568" font-size="17">食用菜取处理后、RO前的支路</text><text x="49" y="598" font-size="14">没有原水直接灌食用菜的旁路</text><text x="49" y="626" font-size="14">不接普通冷凝水、浓水或污水</text><rect x="465" y="540" width="360" height="110" rx="7" class="b"/><text x="479" y="568" font-size="17">菜区V2控制站</text><text x="479" y="598" font-size="14">防回流 / 过滤 / 减压 / 定时</text><text x="479" y="626" font-size="14">分床阀V2.1、V2.2、V2.3</text><rect x="895" y="540" width="370" height="110" rx="7" class="b"/><text x="909" y="568" font-size="17">两排滴灌 / 每床独立关断</text><text x="909" y="598" font-size="14">假设3床共72L/h × 35分钟≈42L</text><text x="909" y="626" font-size="14">先量杯标定；按土湿和天气调整</text><polyline points="395,595 465,595" class="l"/><polyline points="825,595 895,595" class="l"/><rect x="35" y="750" width="360" height="110" rx="7" class="b"/><text x="49" y="778" font-size="17">厨房隔油 + 生活污水 + RO浓水</text><text x="49" y="808" font-size="14">废油单收，雨水不接污水管</text><text x="49" y="836" font-size="14">正常污水预算65L/日</text><rect x="465" y="750" width="360" height="110" rx="7" class="b"/><text x="479" y="778" font-size="17">地下5m³三格化粪处理</text><text x="479" y="808" font-size="14">沉淀/浮渣分离/部分分解</text><text x="479" y="836" font-size="14">3块齐平检查盖，按污泥检查清掏</text><rect x="895" y="750" width="370" height="110" rx="7" class="b"/><text x="909" y="778" font-size="17">合格后续处理端：待场地落实</text><text x="909" y="808" font-size="14">不是密闭存几年，也不拿来浇菜</text><text x="909" y="836" font-size="14">500L应急暂存可用450L约6.9天</text><polyline points="395,805 465,805" class="l"/><polyline points="825,805 895,805" class="l"/><rect x="35" y="960" width="360" height="110" rx="7" class="b"/><text x="49" y="988" font-size="17">空气现有水汽 + 电力</text><text x="49" y="1018" font-size="14">温度、湿度、换气都限制产水</text><text x="49" y="1046" font-size="14">不是有电就一定有水</text><rect x="465" y="960" width="360" height="110" rx="7" class="b"/><text x="479" y="988" font-size="17">饮水级成套空气制水机</text><text x="479" y="1018" font-size="14">试算5L × 0.6度/L = 3度额外</text><text x="479" y="1046" font-size="14">保证来水计0；实测合格后使用</text><rect x="895" y="960" width="370" height="110" rx="7" class="b"/><text x="909" y="988" font-size="17">合格成品小量取用</text><text x="909" y="1018" font-size="14">故障时仍用独立封装饮水</text><text x="909" y="1046" font-size="14">不混普通空调/除湿冷凝水</text><polyline points="395,1015 465,1015" class="l"/><polyline points="825,1015 895,1015" class="l"/><rect x="35" y="1170" width="360" height="110" rx="7" class="b"/><text x="49" y="1198" font-size="17">普通空调 / 除湿冷凝水</text><text x="49" y="1228" font-size="14">盘管、接水盘、管线可能带污染</text><text x="49" y="1256" font-size="14">不含冷库化霜，不用于饮食/食用菜</text><rect x="465" y="1170" width="360" height="110" rx="7" class="b"/><text x="479" y="1198" font-size="17">维修台下60L非饮用回收</text><text x="479" y="1228" font-size="14">初始空，不加进饮水或原水库存</text><text x="479" y="1256" font-size="14">定期清洁排空，溢流另走</text><rect x="895" y="1170" width="370" height="110" rx="7" class="b"/><text x="909" y="1198" font-size="17">适合水质的有限杂用</text><text x="909" y="1228" font-size="14">不回接原水/饮水/食用菜</text><text x="909" y="1256" font-size="14">不喷雾，不把回收率当无限供水</text><polyline points="395,1225 465,1225" class="l"/><polyline points="825,1225 895,1225" class="l"/><polyline points="1080,230 1080,275 215,275 215,330" class="l"/><polyline points="215,440 215,540" class="l"/><polyline points="645,440 645,485 15,485 15,805 35,805" class="l"/><text x="35" y="1340" font-size="15">缺水先停灌：600L罐内低位暂设约余400L可取生活原水；阈值须标定。停电阀默认关闭。</text><text x="35" y="1375" font-size="14">实际水质、管径坡度、防回流、泵压与排放端按现场落实；此图不是施工水力图。</text></svg>